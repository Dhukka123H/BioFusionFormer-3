dataset: TARGET-WT
cohort_size: 121
primary_task_target: wilms_tumor_histologic_subtype (FH=0 vs UH=1)
leakage_guarantee: Strict exclusion of histology sub-types, morphology codes, COG
  risk groups, survival times, and post-baseline events. Features are unscaled and
  unimputed at this stage; preprocessing/imputation must occur strictly inside CV
  folds.
candidate_features:
  age_at_diagnosis_days:
    source_column: supp_Age at Diagnosis in Days
    description: Patient age in days at primary Wilms tumor diagnosis (continuous)
    data_type: continuous
    missing_pct: 0.0
    unique_count: 117
  gender:
    source_column: supp_Gender
    description: Biological sex / gender of patient (Female, Male)
    data_type: categorical_binary
    missing_pct: 0.0
    unique_count: 2
  race:
    source_column: supp_Race
    description: Reported OMB race category (White, Black or African American, Asian,
      Not Reported)
    data_type: categorical
    missing_pct: 0.0
    unique_count: 4
  ethnicity:
    source_column: supp_Ethnicity
    description: Reported OMB ethnicity category (Not Hispanic or Latino, Hispanic
      or Latino, Not Reported)
    data_type: categorical
    missing_pct: 0.0
    unique_count: 3
  stage:
    source_column: supp_Stage
    description: Clinical Wilms tumor NWTS/COG surgical stage at presentation (Stage
      I, II, III, IV)
    data_type: categorical_ordinal
    missing_pct: 0.0
    unique_count: 5
  percent_tumor_nuclei:
    source_column: 'nuclei_% Tumor Nuclei: Top'
    description: Percent tumor nuclei observed in top section of frozen solid tumor
      biopsy
    data_type: continuous_percentage
    missing_pct: 0.8
    unique_count: 8
  percent_necrosis:
    source_column: 'nuclei_% Necrosis: Top'
    description: Percent necrosis observed in top section of frozen solid tumor biopsy
    data_type: continuous_percentage
    missing_pct: 0.8
    unique_count: 6
  percent_stroma:
    source_column: 'nuclei_% Stroma: Top'
    description: Percent stroma observed in top section of frozen solid tumor biopsy
    data_type: continuous_percentage
    missing_pct: 0.8
    unique_count: 15
laterality_note: Laterality was thoroughly investigated across GDC /cases mapping
  (diagnoses.laterality, samples.biospecimen_laterality), clinical supplements, and
  UCSC Xena. In the public TARGET-WT dataset, laterality is unrecorded (100% missing
  / not collected) and therefore omitted.
